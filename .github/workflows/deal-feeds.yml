name: Collect and publish permitted deal feeds
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/collect_deal_feeds.py'
      - 'tools/publish_deal_feed.py'
      - 'tools/verify_live_feed.py'
      - 'tools/check_feed_health.py'
      - 'tests/test_feed_health.py'
      - 'tests/test_feed_publication.py'
      - 'tools/publish_startup_benefits.py'
      - 'config/deal_sources.json'
      - '.github/workflows/deal-feeds.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: devteardown-feed-publication
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check.py
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1
      - name: Collect only enabled official feeds
        id: collect
        continue-on-error: true
        run: python tools/collect_deal_feeds.py --output collection-output --previous published/feeds/status.json
      - name: Validate and render complete attributed source feed
        run: python tools/publish_deal_feed.py --collected collection-output --destination published/feeds
      # Stage each independent source before replacing its last-good files.
      # A failed provider must not suppress another provider's successful refresh.
      - name: Collect attributed that.promo benefits
        id: thatpromo
        continue-on-error: true
        run: |
          python tools/publish_startup_benefits.py --destination staged/thatpromo
          mkdir -p published/feeds/startup-benefits
          cp staged/thatpromo/{data.json,index.html} published/feeds/startup-benefits/
      - name: Collect attributed SaaSOffers benefits
        id: saasoffers
        continue-on-error: true
        run: |
          python tools/publish_startup_benefits.py --source saasoffers --destination staged/saasoffers
          mkdir -p published/feeds/saasoffers
          cp staged/saasoffers/{data.json,index.html} published/feeds/saasoffers/
      - name: Commit only feed files without overwriting current site
        run: |
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/index.html feeds/dealnews.xml feeds/status.json feeds/startup-benefits feeds/saasoffers
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh permitted deal and SaaS source feeds'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/gh-pages | cut -f1)"
      - name: Request build of latest configured Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Server builds the configured branch, never an old uploaded site snapshot.
          test "$(gh api repos/${{ github.repository }}/pages --jq '.build_type')" = 'legacy'
          test "$(gh api repos/${{ github.repository }}/pages --jq '.source.branch')" = 'gh-pages'
          gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Verify live collection timestamp
        run: python tools/verify_live_feed.py --expected published/feeds/status.json
      - name: Report partial collection failure after publishing healthy sources
        if: ${{ always() }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          THATPROMO_OUTCOME: ${{ steps.thatpromo.outcome }}
          SAASOFFERS_OUTCOME: ${{ steps.saasoffers.outcome }}
        run: |
          # The publisher may hold invalid new XML while keeping the last-good feed.
          # Inspect its final status as well as the collector process outcome.
          python tools/check_feed_health.py published/feeds/status.json
          for outcome in "$COLLECT_OUTCOME" "$THATPROMO_OUTCOME" "$SAASOFFERS_OUTCOME"; do
            if [ "$outcome" != 'success' ]; then
              echo '::error::A source failed or was skipped. Last-good data was retained; successful independent sources were allowed to publish.'
              exit 1
            fi
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-deal-feeds-${{ github.run_id }}
          path: |
            collection-output/
            published/feeds/startup-benefits/data.json
            published/feeds/saasoffers/data.json
          retention-days: 7
      - if: always()
        run: |
          echo '## Permitted source feed publication' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sources: unchanged DealNews RSS, attributed that.promo benefits, and free/no-code SaaSOffers benefits. Merchant prices/countries unverified. No domestic community scraping or curated-card modification.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f collection-output/status.json ]; then cat collection-output/status.json >> "$GITHUB_STEP_SUMMARY"; fi
